groups:
  - name: hell-setlog-operational
    rules:
      - alert: HellSetlogReadinessFailure
        expr: increase(hellsetlog_readiness_failures_total[2m]) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Hell Setlog instances cannot reach a required dependency

      - alert: HellSetlogHighErrorRatio
        expr: |
          (
            sum(rate(hellsetlog_http_requests_total{status=~"5.."}[5m]))
            /
            clamp_min(sum(rate(hellsetlog_http_requests_total[5m])), 1)
          ) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Hell Setlog 5xx ratio is above 5 percent

      - alert: HellSetlogHighP95Latency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(hellsetlog_http_request_duration_seconds_bucket[10m]))
          ) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Hell Setlog p95 request latency is above one second

      - alert: HellSetlogBackupMissing
        expr: time() - hellsetlog_backup_last_success_timestamp_seconds > 93600
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: No successful Hell Setlog backup has been observed for 26 hours
