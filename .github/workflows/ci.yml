name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Fixed seeds and locale for reproducibility
env:
  PYTHONHASHSEED: "0"
  TZ: UTC

jobs:
  # ── Backend: lint ────────────────────────────────────────────────────────────
  backend-lint:
    name: Backend lint (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install ruff==0.9.1
      - run: ruff check .

  # ── Backend: compile check ───────────────────────────────────────────────────
  backend-compile:
    name: Backend compile check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt
      - name: Syntax check all Python files
        run: python -m compileall -q .

  # ── Backend: tests ───────────────────────────────────────────────────────────
  backend-test:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest --tb=short -q tests/api tests/integration tests/unit tests/test_authz.py
        env:
          SECRET_KEY: ci-test-secret-not-for-production
          PYTHONHASHSEED: "0"

  # ── Frontend: typecheck ──────────────────────────────────────────────────────
  frontend-typecheck:
    name: Frontend typecheck (tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  # ── Frontend: unit tests ─────────────────────────────────────────────────────
  frontend-test:
    name: Frontend unit tests (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test

  # ── Frontend: production build ───────────────────────────────────────────────
  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # ── Dependency audit ─────────────────────────────────────────────────────────
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm audit (high severity)
        working-directory: frontend
        run: npm audit --audit-level=high
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit
        working-directory: backend
        run: |
          pip install pip-audit
          # python-jose currently requires ecdsa 0.19.2; no fixed upstream release exists.`r`n          pip-audit -r requirements.txt --ignore-vuln PYSEC-2026-1325

  # ── E2E (optional, runs only on push to main) ────────────────────────────────
  e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: [backend-test, frontend-build]
    env:
      E2E_BASE_URL: http://localhost:5173
      E2E_API_URL: http://localhost:8001
      SECRET_KEY: ci-e2e-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements.txt
      - name: Start backend
        run: |
          cd backend
          uvicorn main:app --host 0.0.0.0 --port 8001 &
          for i in $(seq 1 15); do curl -sf http://localhost:8001/api/health && break || sleep 1; done
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Start frontend
        run: |
          cd frontend
          npm run preview -- --port 5173 &
          for i in $(seq 1 15); do curl -sf http://localhost:5173 && break || sleep 1; done
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install chromium --with-deps
        working-directory: e2e
      - run: npx playwright test
        working-directory: e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
