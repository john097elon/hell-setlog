name: heal_setlog
description: 헬스 기록 습관을 만드는 오프라인 퍼스트 운동 로그 앱.
publish_to: none
version: 0.1.0+3

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  riverpod_annotation: ^2.6.1
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  path: ^1.9.0
  uuid: ^4.5.0
  fl_chart: ^0.69.0
  shared_preferences: ^2.5.3
  image_picker: ^1.2.3
  permission_handler: ^12.0.3
  supabase_flutter: ^2.16.0

dev_dependencies:
  build_runner: ^2.4.15
  custom_lint: ^0.7.5
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  riverpod_generator: ^2.6.3
  riverpod_lint: ^2.6.3
  drift_dev: ^2.20.0
  mocktail: ^1.0.0
  fake_async: ^1.3.3
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/character/
    - assets/exercise/
    - assets/help_faq.json
    - assets/routine_presets.json
    - assets/party_presets.json
    - assets/onboarding.json
    - assets/exercise_guide.json

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/app_icon.png"
  adaptive_icon_background: "#0D0D0F"
  adaptive_icon_foreground: "assets/branding/app_icon_fg.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#0D0D0F"
  image: "assets/branding/app_icon_fg.png"
  android_12:
    color: "#0D0D0F"
    image: "assets/branding/app_icon_fg.png"
  android: true
  ios: true
