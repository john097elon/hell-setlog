name: hell-setlog-staging

services:
  migrate:
    image: ${APP_IMAGE:?APP_IMAGE must be an immutable image digest}
    env_file:
      - ${STAGING_ENV_FILE:-/etc/hellsetlog/staging.env}
    command: ["migrate"]
    restart: "no"

  app:
    image: ${APP_IMAGE:?APP_IMAGE must be an immutable image digest}
    env_file:
      - ${STAGING_ENV_FILE:-/etc/hellsetlog/staging.env}
    depends_on:
      migrate:
        condition: service_completed_successfully
      backup-metrics-init:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  backup-metrics-init:
    image: ${APP_IMAGE:?APP_IMAGE must be an immutable image digest}
    user: "0:0"
    command: ["sh", "-c", "chown -R 10001:10001 /metrics"]
    read_only: true
    volumes:
      - backup-metrics:/metrics
    restart: "no"

  backup:
    image: ${APP_IMAGE:?APP_IMAGE must be an immutable image digest}
    env_file:
      - ${STAGING_ENV_FILE:-/etc/hellsetlog/staging.env}
    command: ["/app/ops/backup_loop.sh"]
    environment:
      BACKUP_INTERVAL_SECONDS: 3600
      BACKUP_METRICS_PATH: /metrics/backup.prom
    depends_on:
      migrate:
        condition: service_completed_successfully
      backup-metrics-init:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - backup-metrics:/metrics
    restart: unless-stopped

  edge:
    image: ${CADDY_IMAGE:?CADDY_IMAGE must be an immutable image digest}
    environment:
      APP_HOST: ${APP_HOST:?APP_HOST is required}
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  backup-metrics:
  caddy-data:
  caddy-config:
