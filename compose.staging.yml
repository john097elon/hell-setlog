name: hell-setlog-staging

services:
  migrate:
    image: ${APP_IMAGE:?APP_IMAGE must be an immutable image digest}
    env_file:
      - ${STAGING_ENV_FILE:-/etc/hellsetlog/staging.env}
    command: ["migrate"]
    restart: "no"

  app:
    image: ${APP_IMAGE:?APP_IMAGE must be an immutable image digest}
    env_file:
      - ${STAGING_ENV_FILE:-/etc/hellsetlog/staging.env}
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  edge:
    image: caddy:2.8.4-alpine
    environment:
      APP_HOST: ${APP_HOST:?APP_HOST is required}
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
