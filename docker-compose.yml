name: hell-setlog-development

x-app-environment: &app-environment
  APP_ENV: development
  DATABASE_URL: postgresql+psycopg://hellsetlog:hellsetlog@db:5432/hellsetlog
  CANONICAL_ORIGIN: http://localhost:8000
  ALLOWED_HOSTS: '["localhost","127.0.0.1"]'
  RELEASE: local-compose
  STORAGE_BACKEND: s3
  STORAGE_BUCKET: hellsetlog-development
  STORAGE_REGION: us-east-1
  STORAGE_ENDPOINT_URL: http://object-storage:9000
  STORAGE_ACCESS_KEY: hellsetlog-local
  STORAGE_SECRET_KEY: local-development-only

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hellsetlog
      POSTGRES_USER: hellsetlog
      POSTGRES_PASSWORD: hellsetlog
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hellsetlog -d hellsetlog"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  object-storage:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: hellsetlog-local
      MINIO_ROOT_PASSWORD: local-development-only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - object-data:/data

  object-storage-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    depends_on:
      object-storage:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set local http://object-storage:9000 hellsetlog-local local-development-only; do sleep 1; done
        mc mb --ignore-existing local/hellsetlog-development
        mc anonymous set none local/hellsetlog-development
    restart: "no"

  migrate:
    build:
      context: .
    command: ["migrate"]
    environment:
      <<: *app-environment
      MIGRATION_DATABASE_URL: postgresql+psycopg://hellsetlog:hellsetlog@db:5432/hellsetlog
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
    environment:
      <<: *app-environment
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      object-storage-init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  object-data:
